<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NOVA | Age</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="hero-screen">

    <div class="stars"></div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <!-- Superhero -->

    <section class="superhero">

        <div class="hero-image-container">

            <div class="energy-circle"></div>

            <div class="hero-placeholder">

                <img
                    src="images/nova2.png"
                    alt="NOVA - Guardian of Lost Hope"
                    class="nova-image"
                >

            </div>

        </div>

    </section>


    <!-- Conversation -->

    <section class="conversation">

        <div class="conversation-header">

            <span class="online-dot"></span>

            <span>NOVA • ONLINE</span>

        </div>


        <div class="message nova-message">

            <div class="message-name">
                NOVA
            </div>

            <div class="message-text">

                <p id="greeting"></p>

                <p class="big-question">
                    How old are you?
                </p>

            </div>

        </div>


        <div class="user-input-area">

            <input
                type="number"
                id="ageInput"
                placeholder="Enter your age..."
                min="1"
                max="120"
            >

            <button id="sendAge">
                →
            </button>

        </div>


        <p class="input-hint">
            Press Enter or click the arrow
        </p>

    </section>


    <div class="signal-indicator">

        <span class="signal-dot"></span>

        SECURE SIGNAL CONNECTION

    </div>

</main>


<script>

    const name =
        sessionStorage.getItem("novaName");


    // If someone opens this page directly
    if (!name) {

        window.location.href =
            "index.html";

    }


    document.getElementById("greeting").textContent =
        `Nice to meet you, ${name}! ✨`;


    const ageInput =
        document.getElementById("ageInput");

    const sendAge =
        document.getElementById("sendAge");


    function submitAge() {

        const age =
            ageInput.value.trim();


        if (age === "") {

            ageInput.focus();

            return;

        }


        sessionStorage.setItem(
            "novaAge",
            age
        );


        window.location.href =
            "location.html";

    }


    sendAge.addEventListener(
        "click",
        submitAge
    );


    ageInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                submitAge();

            }

        }
    );

</script>

</body>

</html>
