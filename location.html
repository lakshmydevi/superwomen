<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NOVA | Location</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="hero-screen">

    <div class="stars"></div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <section class="superhero">

        <div class="hero-image-container">

            <div class="energy-circle"></div>

            <div class="hero-placeholder">

                <img
                    src="images/nova2.png"
                    alt="NOVA - Guardian of Lost Hope"
                    class="nova-image"
                >

            </div>

        </div>

    </section>


    <section class="conversation">

        <div class="conversation-header">

            <span class="online-dot"></span>

            <span>NOVA • ONLINE</span>

        </div>


        <div class="message nova-message">

            <div class="message-name">
                NOVA
            </div>

            <div class="message-text">

                <p>
                    Got it, <span id="userName"></span>. 👍
                </p>

                <p class="big-question">
                    Where are you from?
                </p>

            </div>

        </div>


        <div class="user-input-area">

            <input
                type="text"
                id="locationInput"
                placeholder="City / Location..."
            >

            <button id="sendLocation">
                →
            </button>

        </div>


        <p class="input-hint">
            Press Enter or click the arrow
        </p>

    </section>


    <div class="signal-indicator">

        <span class="signal-dot"></span>

        SECURE SIGNAL CONNECTION

    </div>

</main>


<script>

    const name =
        sessionStorage.getItem("novaName");


    if (!name) {

        window.location.href =
            "index.html";

    }


    document.getElementById(
        "userName"
    ).textContent = name;


    const locationInput =
        document.getElementById(
            "locationInput"
        );

    const sendLocation =
        document.getElementById(
            "sendLocation"
        );


    function submitLocation() {

        const location =
            locationInput.value.trim();


        if (location === "") {

            locationInput.focus();

            return;

        }


        sessionStorage.setItem(
            "novaLocation",
            location
        );


        window.location.href =
            "email.html";

    }


    sendLocation.addEventListener(
        "click",
        submitLocation
    );


    locationInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                submitLocation();

            }

        }
    );

</script>

</body>

</html>
